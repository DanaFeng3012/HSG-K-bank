<!DOCTYPE html>
<html lang="zh">
<head>

<title>K Bank · 需求分析 Workshop 追踪看板</title>
<style>
  /* ============================================================
     THEME TOKENS — tweak colors / spacing here (light theme)
     ============================================================ */
  :root {
    --bg: #f4f5f8;
    --surface: #ffffff;
    --border: #eceef2;
    --border-strong: #e2e5ea;
    --text: #1a1d24;
    --text-soft: #8a92a3;
    --accent: #4b63ff;
    --accent-soft: #eef1ff;
    --danger: #f5455c;
    --danger-soft: #fff0f2;
    --radius: 14px;
    --radius-sm: 9px;
    --shadow: 0 1px 2px rgba(20, 24, 40, .04), 0 4px 16px rgba(20, 24, 40, .04);
    --shadow-lift: 0 6px 24px rgba(20, 24, 40, .10);
    --font: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 480px at 15% -10%, #eef1ff 0%, transparent 55%),
      radial-gradient(1000px 420px at 100% 0%, #eafff6 0%, transparent 50%),
      var(--bg);
    color: var(--text); font-family: var(--font); font-size: 14px; padding: 32px 28px; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1440px; margin: 0 auto; }

  /* page header */
  .page-head { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .page-head .logo { width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(135deg, var(--accent), #7a5af5); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px; box-shadow: 0 6px 16px rgba(75, 99, 255, .35); }
  .page-head h1 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .page-head p { color: var(--text-soft); font-size: 13px; margin-top: 2px; }

  /* view tabs */
  .tabs { display: inline-flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 22px; box-shadow: var(--shadow); }
  .tab { padding: 8px 18px; cursor: pointer; color: var(--text-soft); font-weight: 500; border-radius: 9px; transition: all .18s ease; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); background: var(--accent-soft); }

  /* stat cards */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 18px 12px 20px; box-shadow: var(--shadow); overflow: hidden; transition: transform .18s ease, box-shadow .18s ease; }
  .stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
  .stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); opacity: .85; }
  .stat:nth-child(2)::before { background: #0fbf8f; }
  .stat:nth-child(3)::before { background: #f7a234; }
  .stat:nth-child(4)::before { background: #7a5af5; }
  .stat .label { color: var(--text-soft); font-size: 12px; margin-bottom: 4px; }
  .stat .value { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }

  /* toolbar */
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .btn { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 9px 18px; font-size: 14px; cursor: pointer; font-weight: 600; box-shadow: 0 4px 12px rgba(75, 99, 255, .28); transition: transform .12s ease, box-shadow .18s ease, filter .18s ease; }
  .btn:hover { filter: brightness(1.05); box-shadow: 0 6px 18px rgba(75, 99, 255, .36); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: var(--surface); color: var(--text-soft); border: 1px solid var(--border-strong); box-shadow: none; font-weight: 500; }
  .btn.ghost:hover { color: var(--text); filter: none; }
  .spacer { flex: 1; }
  .search-box { position: relative; }
  .search-box svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-soft); pointer-events: none; }
  .search-box input { padding-left: 32px; }
  input, select { font-family: var(--font); font-size: 14px; border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 11px; background: var(--surface); color: var(--text); outline: none; transition: border-color .15s ease, box-shadow .15s ease; }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { font-family: var(--font); font-size: 13px; line-height: 1.55; border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 11px; width: 100%; background: var(--surface); color: var(--text); outline: none; resize: vertical; min-height: 60px; transition: border-color .15s ease, box-shadow .15s ease; }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  /* table view */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  #view-table { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 14px 18px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  thead th { background: #fafbfd; color: var(--text-soft); font-weight: 600; font-size: 12px; letter-spacing: .03em; text-transform: uppercase; position: sticky; top: 0; }
  tbody tr { transition: background .12s ease; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--accent-soft); }
  td.name { font-weight: 600; cursor: pointer; }
  td.name:hover { color: var(--accent); }
  .clamp { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--text-soft); }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .9; }
  .chip { padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .col-actions { width: 78px; text-align: center; }
  td.longcell { white-space: normal; }
  .cell-long { max-width: 260px; cursor: pointer; line-height: 1.45; }
  .cell-long .txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; }
  .cell-long .cnt { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 5px; padding: 1px 5px; font-size: 10.5px; font-weight: 700; margin-right: 5px; vertical-align: 1px; }
  .cell-long:hover .txt { color: var(--accent); }

  /* 按条录入（编辑弹窗内的意见列表） */
  .item-list { display: flex; flex-direction: column; gap: 8px; }
  .item-row { display: flex; gap: 8px; align-items: flex-start; }
  .item-idx { flex: 0 0 auto; min-width: 22px; height: 22px; border-radius: 7px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 700; display: grid; place-items: center; margin-top: 9px; }
  .item-row textarea { flex: 1; min-height: 50px; overflow: hidden; }
  .item-del { flex: 0 0 auto; margin-top: 8px; opacity: .45; }
  .item-del:hover { opacity: 1; }
  .add-item { align-self: flex-start; background: none; border: 1px dashed var(--border-strong); color: var(--accent); border-radius: 9px; padding: 6px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: background .15s ease; }
  .add-item:hover { background: var(--accent-soft); border-color: var(--accent); }

  /* 只读详情抽屉 */
  .drawer-overlay { position: fixed; inset: 0; background: rgba(20, 24, 40, .34); backdrop-filter: blur(3px); z-index: 55; animation: fade .16s ease; }
  .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(580px, 94vw); background: var(--surface); display: flex; flex-direction: column; box-shadow: -14px 0 44px rgba(20, 24, 40, .18); animation: slidein .22s cubic-bezier(.2,.8,.3,1); }
  @keyframes slidein { from { transform: translateX(28px); opacity: .7; } }
  .drawer header { padding: 22px 24px 14px; border-bottom: 1px solid var(--border); }
  .drawer header h2 { font-size: 17px; font-weight: 700; margin: 10px 0 6px; line-height: 1.4; }
  .d-badges { display: flex; gap: 8px; }
  .d-meta { color: var(--text-soft); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
  .d-body { flex: 1; overflow-y: auto; padding: 18px 24px 24px; }
  .d-sec { margin-bottom: 18px; }
  .d-title { font-size: 12px; font-weight: 700; letter-spacing: .04em; margin-bottom: 6px; }
  .d-sec ol { margin: 0; padding-left: 22px; }
  .d-sec li { font-size: 13.5px; line-height: 1.7; margin-bottom: 6px; white-space: pre-wrap; word-break: break-word; }
  .d-sec li::marker { color: var(--text-soft); font-weight: 700; font-size: 12px; }
  .drawer footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; background: #fafbfd; }
  .icon-btn { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; border: none; background: transparent; color: var(--text-soft); cursor: pointer; opacity: 0; transition: all .15s ease; }
  tbody tr:hover .icon-btn { opacity: 1; }
  .js-detail-btn { opacity: .5; }
  tbody tr:hover .js-detail-btn { opacity: 1; }
  .icon-btn:hover { background: var(--danger-soft); color: var(--danger); }
  .js-detail-btn:hover { background: var(--accent-soft); color: var(--accent); }

  /* board (kanban) view */
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(280px, 1fr); gap: 16px; overflow-x: auto; padding-bottom: 8px; }
  .col { background: rgba(255,255,255,.7); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; backdrop-filter: blur(4px); }
  .col h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
  .col h3 .count { color: var(--text-soft); font-weight: 500; background: var(--bg); border-radius: 999px; padding: 1px 9px; font-size: 12px; }
  .col-body { min-height: 40px; display: flex; flex-direction: column; gap: 10px; }
  .ticket { position: relative; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px 14px; cursor: grab; background: var(--surface); box-shadow: var(--shadow); transition: transform .12s ease, box-shadow .18s ease; }
  .ticket:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
  .ticket.dragging { opacity: .4; }
  .ticket .t-name { font-weight: 600; margin-bottom: 10px; padding-right: 22px; line-height: 1.4; }
  .ticket .t-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--text-soft); font-size: 12px; }
  .ticket .t-del { position: absolute; top: 8px; right: 8px; }
  .ticket:hover .t-del { opacity: 1; }
  .col.drop-hover { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-soft); }

  /* BA 汇总视图 */
  .sum-gen { color: var(--text-soft); font-size: 12px; margin-bottom: 14px; }
  .sum-batch { margin-bottom: 26px; }
  .sum-batch h2 { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  .sum-module { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .sum-module h3 { font-size: 14.5px; font-weight: 700; margin-bottom: 4px; }
  .sum-meta { color: var(--text-soft); font-size: 12px; display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .sum-sec { margin-top: 10px; }
  .sum-sec .sec-title { font-size: 12px; font-weight: 700; letter-spacing: .04em; margin-bottom: 4px; }
  .sum-sec ol { margin: 0; padding-left: 22px; }
  .sum-sec li { font-size: 13px; line-height: 1.7; margin-bottom: 4px; white-space: pre-wrap; word-break: break-word; }
  .sum-sec li::marker { color: var(--text-soft); font-weight: 700; font-size: 12px; }
  .sec-c { color: #3bb066; } .sec-d { color: #f53f3f; } .sec-t { color: #f77234; }
  .sec-g { color: #7a5af5; } .sec-n { color: #4b63ff; } .sec-o { color: #0aa2c0; }
  .sum-empty { color: var(--text-soft); font-size: 12.5px; font-style: italic; }
  .sum-hint { color: var(--text-soft); font-size: 12.5px; margin-top: 6px; }
  @media print {
    body { background: #fff; padding: 0; }
    .page-head, .tabs, .stats, .toolbar, #view-table, #view-board { display: none !important; }
    .sum-module { box-shadow: none; break-inside: avoid; }
    .sum-batch { break-inside: avoid; }
  }

  .hidden { display: none; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #1f2937; color: #fff; font-size: 13px; padding: 10px 18px; border-radius: 999px; box-shadow: 0 10px 30px rgba(20, 24, 40, .25); opacity: 0; transition: opacity .25s ease; z-index: 60; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* modal */
  .overlay { position: fixed; inset: 0; background: rgba(20, 24, 40, .34); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; animation: fade .16s ease; z-index: 50; }
  @keyframes fade { from { opacity: 0; } }
  .modal { background: var(--surface); border-radius: 18px; padding: 26px; width: 600px; max-width: 92vw; max-height: 88vh; overflow-y: auto; box-shadow: 0 24px 60px rgba(20, 24, 40, .28); animation: pop .18s cubic-bezier(.2,.8,.3,1); }
  @keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } }
  .modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .modal .sub { color: var(--text-soft); font-size: 13px; margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; color: var(--text-soft); font-size: 13px; margin-bottom: 6px; }
  .field input, .field select { width: 100%; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; align-items: center; gap: 8px; margin-top: 22px; position: sticky; bottom: -26px; background: var(--surface); padding: 12px 0 2px; }
  .btn.danger { background: var(--danger); box-shadow: 0 4px 12px rgba(245, 69, 92, .28); }
  .link-danger { color: var(--danger); cursor: pointer; background: none; border: none; font-size: 14px; font-weight: 500; padding: 8px 10px; border-radius: 8px; }
  .link-danger:hover { background: var(--danger-soft); }

  /* ---- gantt view ---- */
  #view-gantt { overflow-x: auto; }
  .gantt-wrap { min-width: 1200px; }
  /* 甘特图大 grid：第 1 列 labelW，后续 totalDays 列各 dayWidth — header + body 共享此模板，天然对齐 */
  .gantt-grid { display: grid; }
  .gantt-head { position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--border); }
  .gantt-head .label-cell { background: #fafbfd; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .gantt-head .gantt-month { height: 32px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: var(--text); border-right: 1px solid var(--border); background: #fafbfd; border-bottom: 1px solid var(--border); }
  .gantt-head .gantt-day { height: 24px; font-size: 10px; color: var(--text-soft); padding-left: 2px; display: flex; align-items: flex-end; padding-bottom: 2px; border-right: 1px solid var(--border); background: #fcfcfd; }
  .gantt-head .gantt-day.weekend { background: #f4f4f7; color: #c0c6d0; }
  /* body */
  .gantt-body { position: relative; }
  .gantt-body .grid-row { display: grid; align-items: stretch; min-height: 40px; border-bottom: 1px solid var(--border); grid-column: 1 / -1; }
  .gantt-body .grid-row:hover { background: var(--accent-soft); }
  .gantt-body .grid-row.heading-row { background: #fafbfd; min-height: 36px; }
  .gantt-body .grid-row.heading-row > .label-cell { font-weight: 700; font-size: 13px; color: var(--text); display: flex; align-items: center; padding-left: 12px; gap: 8px; border-right: 1px solid var(--border); }
  .label-cell { border-right: 1px solid var(--border); padding: 8px 12px; display: grid; gap: 3px; align-content: center; min-width: 0; }
  .gantt-row-name { font-weight: 600; font-size: 12.5px; line-height: 1.35; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .gantt-row-name:hover { color: var(--accent); }
  .gantt-row-meta { font-size: 10.5px; color: var(--text-soft); line-height: 1.3; }
  .gantt-row-cl { font-size: 10px; color: #8a5af5; line-height: 1.25; margin-top: 2px; background: rgba(122, 90, 245, .07); padding: 2px 5px; border-radius: 3px; max-width: 260px; }
  /* timeline 列 — 一个相对定位容器 */
  .timeline-cell { position: relative; overflow: visible; }
  /* 整份 body 共用的遮罩层 — 只画一次在最底层（用 left/width/top/bottom 而非 inset，兼容 Safari） */
  .gantt-shared-overlay { position: absolute; top: 0; bottom: 0; pointer-events: none; z-index: 0; }
  /* Gate 覆盖元素 */
  .gate-line { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(245, 63, 63, .45); border-left: 1.5px dashed rgba(245, 63, 63, .55); z-index: 1; }
  .gate-diamond { position: absolute; width: 18px; height: 18px; background: #f53f3f; transform: rotate(45deg); border-radius: 3px; box-shadow: 0 2px 8px rgba(245, 63, 63, .45); z-index: 5; pointer-events: auto; cursor: pointer; margin-top: 36px; }
  .gate-diamond:hover { box-shadow: 0 0 0 4px rgba(245, 63, 63, .2), 0 2px 8px rgba(245, 63, 63, .5); }
  .gate-label { position: absolute; color: #d93f3f; font-size: 11px; font-weight: 700; white-space: nowrap; transform: translateX(-50%); z-index: 5; pointer-events: none; margin-top: 60px; text-shadow: 0 0 3px rgba(255,255,255,.7); }
  /* 任务条 */
  .gantt-bar { position: absolute; top: 8px; height: 24px; border-radius: 6px; display: flex; align-items: center; padding: 0 10px; font-size: 11px; font-weight: 700; color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.14); cursor: grab; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: box-shadow .15s, filter .15s; user-select: none; z-index: 2; }
  .gantt-bar:hover { box-shadow: 0 3px 10px rgba(0,0,0,.22); filter: brightness(1.08); z-index: 5; }
  .gantt-bar.milestone { width: 24px; height: 24px; padding: 0; display: grid; place-items: center; transform: rotate(45deg); border-radius: 4px; }
  .gantt-bar.milestone > span { transform: rotate(-45deg); font-size: 10px; }
  .gantt-bar.bar-done { opacity: .72; filter: grayscale(.12); }
  .gantt-bar.dragging { cursor: grabbing; z-index: 10; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  /* 拖拽 resize 手柄（hover 时可见） */
  .gantt-bar .resize { position: absolute; top: 0; bottom: 0; width: 5px; background: rgba(255,255,255,0); transition: background .15s; cursor: ew-resize; z-index: 6; }
  .gantt-bar .resize.left { left: 0; border-radius: 6px 0 0 6px; }
  .gantt-bar .resize.right { right: 0; border-radius: 0 6px 6px 0; }
  .gantt-bar:hover .resize { background: rgba(255,255,255,.55); }
  /* unavailable — 降低视觉权重 */
  .gantt-unavail { position: absolute; top: 0; bottom: 0; pointer-events: none; background: repeating-linear-gradient(45deg, rgba(245, 63, 63, .07), rgba(245, 63, 63, .07) 6px, rgba(245, 63, 63, .03) 6px, rgba(245, 63, 63, .03) 12px); }
  /* today */
  .gantt-today { position: absolute; top: 0; bottom: 0; width: 2px; background: #f53f3f; z-index: 4; pointer-events: none; }
  .gantt-today-label { position: absolute; transform: translateX(-50%); background: #f53f3f; color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 3px; z-index: 5; white-space: nowrap; pointer-events: none; }
  .gantt-legend { display: flex; gap: 16px; padding: 10px 14px; font-size: 11.5px; color: var(--text-soft); flex-wrap: wrap; }
  .gantt-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .gantt-legend .swatch { width: 18px; height: 11px; border-radius: 3px; flex-shrink: 0; }
  .gantt-tooltip { position: fixed; background: #1a1d24; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 12px; line-height: 1.55; z-index: 60; pointer-events: none; max-width: 340px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .gantt-tooltip strong { display: block; font-size: 13px; margin-bottom: 3px; }
  /* 拖拽提示 */
  .gantt-drag-hint { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 12.5px; font-weight: 600; z-index: 100; box-shadow: 0 4px 14px rgba(75,99,255,.35); }
</style>
</head>

<div class="wrap">
  <div class="page-head">
    <div class="logo">K</div>
    <div>
      <h1>K Bank · 需求分析 Workshop 追踪看板</h1>
      <p>模块排期 · 确认/争议/讨论点 · GAP 结论 · Next Step 与交付物闭环 ｜ 排期来源：Req Plan-20261029（Option 1 · 3 轮确认）｜ 数据仅存于当前浏览器 ｜ 会议纪要为增量合并更新，已有内容不会被覆盖</p>

// ---- 连接状态指示器 ----
function setStatus(dotColor, text) {
  const d = document.getElementById("status-dot");
  const t = document.getElementById("status-text");
  if (d) d.style.background = dotColor;
  if (t) t.textContent = text;

// ---- Firebase 封装 ----
let _fb = null;       // { app, db, itemsRef, dictsRef, connected: boolean }
let _fbListening = false;
let _fbLocalWrite = false;  // 标记"这是我刚写的，不要被 onValue 当成远端变化触发重绘"

// 判断 Firebase 配置是否完整
function firebaseConfigured() {
  const c = CONFIG.firebaseConfig;
  return !!(c && c.databaseURL && c.databaseURL.startsWith("https://"));
}

// 初始化 Firebase（配置不完整则返回 null）
async function initFirebase() {
  if (_fb) return _fb;
  if (!firebaseConfigured()) { setStatus("#f59e0b", "未配置云端 · 离线模式"); return null; }
  if (typeof firebase === "undefined") { setStatus("#ef4444", "Firebase SDK 未加载"); return null; }
  try {
    const app = firebase.initializeApp(CONFIG.firebaseConfig);
    const db = firebase.database();
    const itemsRef = db.ref(CONFIG.firebasePath);
    const dictsRef = db.ref(CONFIG.firebaseDictsPath);
    _fb = { app, db, itemsRef, dictsRef };
    setStatus("#3b82f6", "云端已连接");
    console.log("[Firebase] connected ✅");
    return _fb;
  } catch (e) {
    console.warn("[Firebase] init failed:", e.message);
    setStatus("#ef4444", "云端初始化失败");
    return null;
  }
}

// ---- store 层：Firebase 实时同步 + localStorage 离线缓存 ----
const store = {
  _dictKey: "kbank-workshop-board-v2:dicts",
  _itemKey: CONFIG.storageKey,

  // 启动时：优先 Firebase → 次 fetch data.json → 最后 localStorage → seed
  async load() {
    // 1) 初始化 Firebase（如果配置了）
    const fb = await initFirebase();

    // 2) 加载 localStorage 缓存（始终加载，做离线 fallback）
    let localItems = null, localDicts = null;
    try {
      const raw = localStorage.getItem(this._itemKey);
      if (raw) localItems = JSON.parse(raw);
      const dr = localStorage.getItem(this._dictKey);
      if (dr) localDicts = JSON.parse(dr);
    } catch {}

    // 3) 从远端获取（Firebase 优先，fallback fetch data.json）
    let remoteItems = null, remoteDicts = null;
    if (fb) {
      // ===== Firebase 模式 =====
      try {
        const snap = await fb.itemsRef.once("value");
        const val = snap.val();
        // Realtime DB 存的可能是对象（id 作为 key）或数组
        if (val && typeof val === "object" && !Array.isArray(val)) {
          remoteItems = Object.values(val);
        } else if (Array.isArray(val)) {
          remoteItems = val.filter(Boolean);
        }

        const dSnap = await fb.dictsRef.once("value");
        const dVal = dSnap.val();
        if (dVal && dVal.priorities && dVal.statuses) remoteDicts = dVal;

        // 启动实时监听（别人改了自动收到）
        this._startFirebaseListener(fb);
        setStatus("#3b82f6", "云端已连接 · 实时同步中");
      } catch (e) {
        console.warn("[Firebase] read failed:", e.message);
        setStatus("#f59e0b", "云端读取失败，用本地缓存");
      }
    } else {
      // ===== Fallback: fetch data.json =====
      try {
        const resp = await fetch("data.json", { cache: "no-cache" });
        if (resp.ok) {
          const d = await resp.json();
          if (Array.isArray(d)) remoteItems = d;
          else if (d && Array.isArray(d.items)) {
            remoteItems = d.items;
            remoteDicts = d.dicts;
          }
        }
      } catch {}
    }

    // 4) 合并：远端优先，保留本地独有条目
    let finalItems;
    if (remoteItems && remoteItems.length) {
      const remoteIds = new Set(remoteItems.map(x => x.id));
      const localOnly = (localItems || []).filter(x => !remoteIds.has(x.id));
      // changelog/minutes 合并去重
      const remoteMap = new Map(remoteItems.map(x => [x.id, x]));
      const merged = remoteItems.map(r => {
        const l = localItems?.find(x => x.id === r.id);
        if (!l) return r;
        const m = { ...r };
        // changelog 合并（远端 + 本地独有的）
        const rc = r.changelog || [], lc = l.changelog || [];
        const rcKeys = new Set(rc.map(c => (c.time||"")+"|"+(c.from||"")+"|"+(c.to||"")));
        m.changelog = [...rc, ...lc.filter(c => !rcKeys.has((c.time||"")+"|"+(c.from||"")+"|"+(c.to||"")))];
        // minutes 合并
        const rm = r.minutes || [], lm = l.minutes || [];
        const rmKeys = new Set(rm.map(x => (x.time||"")+"|"+(x.title||"")));
        m.minutes = [...rm, ...lm.filter(x => !rmKeys.has((x.time||"")+"|"+(x.title||"")))];
        return m;
      });
      finalItems = [...merged, ...localOnly];
    } else if (localItems && localItems.length) {
      finalItems = localItems;
      setStatus("#f59e0b", "离线模式（用本地缓存）");
    } else {
      finalItems = structuredClone(CONFIG.seed);
      setStatus("#22c55e", "首次加载 · 已初始化");
    }

    // 5) dicts 合并
    let finalDicts = remoteDicts || localDicts || { priorities: CONFIG.priorities, statuses: CONFIG.statuses };
    if (localDicts && !remoteDicts) finalDicts = localDicts;
    if (Array.isArray(finalDicts.priorities)) CONFIG.priorities = finalDicts.priorities;
    if (Array.isArray(finalDicts.statuses)) CONFIG.statuses = finalDicts.statuses;

    // 6) 写回 localStorage
    localStorage.setItem(this._itemKey, JSON.stringify(finalItems));
    localStorage.setItem(this._dictKey, JSON.stringify(finalDicts));

    return finalItems;
  },

  // 启动 Firebase 实时监听
  _startFirebaseListener(fb) {
    if (_fbListening) return;
    _fbListening = true;
    fb.itemsRef.on("value", (snap) => {
      if (_fbLocalWrite) { _fbLocalWrite = false; return; }  // 我刚写的，跳过
      const val = snap.val();
      let remoteItems = null;
      if (val && typeof val === "object" && !Array.isArray(val)) remoteItems = Object.values(val);
      else if (Array.isArray(val)) remoteItems = val.filter(Boolean);
      if (remoteItems && remoteItems.length) {
        console.log("[Firebase] → 收到远端更新（" + remoteItems.length + " 条）");
        // 应用远端数据，自动刷新
        window.__applyRemoteUpdate && window.__applyRemoteUpdate(remoteItems);
      }
    });
    fb.dictsRef.on("value", (snap) => {
      if (_fbLocalWrite) { _fbLocalWrite = false; return; }
      const d = snap.val();
      if (d && Array.isArray(d.priorities) && Array.isArray(d.statuses)) {
        CONFIG.priorities = d.priorities;
        CONFIG.statuses = d.statuses;
        localStorage.setItem(this._dictKey, JSON.stringify(d));
        window.__refreshUI && window.__refreshUI();
      }
    });
  },

  // --- debounce 自动保存（Firebase + localStorage）---
  save(items) {
    // 始终写 localStorage（离线可用）
    localStorage.setItem(this._itemKey, JSON.stringify(items));
    localStorage.setItem(this._dictKey, JSON.stringify({ priorities: CONFIG.priorities, statuses: CONFIG.statuses }));

    // 写 Firebase（debounce 300ms 防刷屏）
    this._debounceSave(items);
  },

  _debounceSave(items) {
    if (!firebaseConfigured() || !_fb) return;
    clearTimeout(this._saveTimer);
    this._saveTimer = setTimeout(async () => {
      try {
        _fbLocalWrite = true;  // 标记"这是我写的"，让 onValue 监听跳过
        // Realtime DB 不直接存数组，用 id 做 key 存储
        const obj = {};
        items.forEach(it => { obj[it.id] = it; });
        await _fb.itemsRef.set(obj);
        await _fb.dictsRef.set({ priorities: CONFIG.priorities, statuses: CONFIG.statuses });
        setStatus("#3b82f6", "云端已同步 ✓");
        // 3 秒后恢复
        setTimeout(() => setStatus("#3b82f6", "实时同步中"), 3000);
      } catch (e) {
        console.warn("[Firebase] save failed:", e.message);
        setStatus("#ef4444", "保存失败，请检查网络");
      }
    }, 300);
  },
};

// 把 "2026/11/2 ~ 11/4" 这种文本日期解析成 {start, end}
function parseDateRange(str) {
  if (!str) return { start: "", end: "" };
  str = str.trim();
  // 匹配 "2026/11/2 ~ 11/4" 或 "2026/11/2~2026/11/4" 或 "2026/11/2"
  const m = str.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})\s*[~～到\-—]?\s*(\d{4})?[\/\-]?(\d{1,2})?[\/\-]?(\d{1,2})?/);
  if (!m) return { start: "", end: "" };
  const y1 = m[1], mo1 = m[2].padStart(2, "0"), d1 = m[3].padStart(2, "0");
  let start = `${y1}-${mo1}-${d1}`;
  let end = start; // 单日默认 start === end
  if (m[4]) { end = `${m[4]}-${(m[5]||1).padStart(2,"0")}-${(m[6]||1).padStart(2,"0")}`; }
  else if (m[5]) { end = `${y1}-${m[5].padStart(2,"0")}-${(m[6]||m[3]).padStart(2,"0")}`; }
  // 如果 end 只给了日（短格式），继承 start 的年月
  if (end === start) {
    const tail = str.match(/~\s*(\d{1,2})$/);
    if (tail) {
      const mo2 = parseInt(tail[1]) < 13 ? parseInt(tail[1]) : parseInt(tail[1]);
      // 先试试 "~ 4" 是同月下一天；不行再猜是下个月的 day
      end = `${y1}-${mo1}-${tail[1].padStart(2,"0")}`;
    }
    const tail2 = str.match(/~\s*(\d{1,2})\/(\d{1,2})$/);
    if (tail2) { end = `${y1}-${tail2[1].padStart(2,"0")}-${tail2[2].padStart(2,"0")}`; }
    const tail3 = str.match(/~\s*(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
    if (tail3) { end = `${tail3[1]}-${tail3[2].padStart(2,"0")}-${tail3[3].padStart(2,"0")}`; }
  }
  return { start, end };
}

// 把 {start:"2026-11-02", end:"2026-11-04"} 格式化成 "2026/11/2 ~ 11/4"
function formatDateRange(start, end) {
  if (!start) return "";
  const s = start.replace(/-/g, "/");
  if (!end || start === end) return s.replace(/\/0(\d)/g, "/$1");
  const sy = start.slice(0,4), ey = end.slice(0,4);
  let e = end.replace(/-/g, "/");
  if (sy === ey) {
    // 同年：结束只写 M/D
    const parts = e.split("/");
    e = `${parseInt(parts[1])}/${parseInt(parts[2])}`;
  }
  return `${s.replace(/\/0(\d)/g, "/$1")} ~ ${e}`;
}

function importBoardJSON() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        let newItems, newDicts;
        if (Array.isArray(data)) {
          newItems = data; // 纯数组（向后兼容）
        } else if (data && Array.isArray(data.items)) {
          newItems = data.items;
          newDicts = data.dicts;
        } else {
          showToast("❌ JSON 格式不对（应该是数组或 {items:[], dicts:{}}）"); return;
        }
        // 合并 dicts
        if (newDicts) {
          if (Array.isArray(newDicts.priorities)) CONFIG.priorities = newDicts.priorities;
          if (Array.isArray(newDicts.statuses)) CONFIG.statuses = newDicts.statuses;
        }
        // 合并 items（不是覆盖！保留本地独有的 + 用导入的更新现有）
        const importMap = new Map(newItems.map(x => [x.id, x]));
        const localIds = new Set(items.map(x => x.id));
        items = items.map(it => {
          const r = importMap.get(it.id); if (!r) return it;
          return { ...it, ...r }; // 导入的数据优先
        });
        // 导入独有的条目也加上
        items = [...items, ...newItems.filter(x => !localIds.has(x.id))];
        items = migrate(items);
        store.save(items);
        initFilters(); render();
        showToast(`✅ 已导入 ${newItems.length} 条（合并后本地共 ${items.length} 条）`);
      } catch(e) { showToast("❌ 解析失败：" + e.message); }
    };
    r.readAsText(f);
  };
  inp.click();
}

// 长文本字段按「条」存储（数组，一条内部可含换行）；兼容历史数据（字符串按行拆分）
const LONG_FIELDS = ["confirmed", "disputes", "discussions", "gapConclusion", "nextStep", "deliverables", "remarks"];
const linesOf = v => Array.isArray(v)
  ? v.map(x => String(x ?? "").trim()).filter(Boolean)
  : String(v ?? "").split("\n").map(x => x.trim()).filter(Boolean);

function migrate(list) {
  list.forEach(it => {
    LONG_FIELDS.forEach(f => {
      if (!Array.isArray(it[f])) it[f] = String(it[f] ?? "").split("\n").map(x => x.trim()).filter(Boolean);
    });
    // 对象数组字段：确保存在且为数组
    if (!Array.isArray(it.minutes)) it.minutes = [];
    if (!Array.isArray(it.changelog)) it.changelog = [];
  });
  return list;
}

(async () => {

  // ---- Firebase 实时更新处理 ----
  // 远端数据到达时合并（changelog/minutes 去重），自动刷新
  window.__applyRemoteUpdate = (remoteItems) => {
    if (!remoteItems || !remoteItems.length) return;
    const remoteMap = new Map(remoteItems.map(x => [x.id, x]));
    const remoteIds = new Set(remoteItems.map(x => x.id));
    const localOnly = items.filter(x => !remoteIds.has(x.id));
    items = remoteItems.map(r => {
      const l = items.find(x => x.id === r.id);
      if (!l) return r;
      const m = { ...r };
      const rc = r.changelog || [], lc = l.changelog || [];
      const rcKeys = new Set(rc.map(c => (c.time||"")+"|"+(c.from||"")+"|"+(c.to||"")));
      m.changelog = [...rc, ...lc.filter(c => !rcKeys.has((c.time||"")+"|"+(c.from||"")+"|"+(c.to||"")))];

      m.minutes = [...rm, ...lm.filter(x => !rmKeys.has((x.time||"")+"|"+(x.title||"")))];
      return m;
    }).concat(localOnly);
    localStorage.setItem(store._itemKey, JSON.stringify(items));

  if (nC) chips.push(`<span class="chip" style="background:#eafaef;color:#3bb066">确认 ${nC}</span>`);
  if (nD) chips.push(`<span class="chip" style="background:#fde2e2;color:#f53f3f">争议 ${nD}</span>`);
  if (nT) chips.push(`<span class="chip" style="background:#fff1e0;color:#f77234">讨论 ${nT}</span>`);
  if (linesOf(item.gapConclusion).length) chips.push(`<span class="chip" style="background:#f0eafe;color:#7a5af5">有 GAP 结论</span>`);
  if (linesOf(item.deliverables).length) chips.push(`<span class="chip" style="background:#eef1ff;color:#4b63ff">交付物 ${linesOf(item.deliverables).length}</span>`);
  return `<div class="ticket" draggable="true" data-id="${item.id}">
    <button class="icon-btn js-del t-del" title="删除">${TRASH_SVG}</button>
    <div class="t-name">${esc(item.name)}</div>
    <div class="t-meta">
      <span class="badge" style="background:${p.color};color:${p.text}">${esc(p.key)}</span>
      ${item.dates ? `<span>🗓 ${esc(item.dates)}</span>` : ""}
      ${item.owner ? `<span>${esc(item.owner)}</span>` : ""}
    </div>
    ${chips.length ? `<div class="t-meta" style="margin-top:8px">${chips.join("")}</div>` : ""}
  </div>`;
}

function wireDnD() {
  let dragId = null;
  $("#view-board").querySelectorAll(".ticket").forEach(t => {
    t.ondragstart = () => { dragId = t.dataset.id; t.classList.add("dragging"); };
    t.ondragend = () => t.classList.remove("dragging");
    t.onclick = () => openModal(items.find(i => i.id == t.dataset.id));
  });
  $("#view-board").querySelectorAll(".js-del").forEach(btn =>
    btn.onclick = e => { e.stopPropagation(); confirmDelete(items.find(i => i.id == btn.closest(".ticket").dataset.id)); });
  $("#view-board").querySelectorAll(".col").forEach(col => {
    col.ondragover = e => { e.preventDefault(); col.classList.add("drop-hover"); };
    col.ondragleave = () => col.classList.remove("drop-hover");
    col.ondrop = () => {
      col.classList.remove("drop-hover");
      const item = items.find(i => i.id == dragId);
      if (item) { item.status = col.dataset.status; persist(); }
    };
  });
}

function render() {
  try {
  renderStats();
  $("#view-table").classList.toggle("hidden", currentView !== "table");
  $("#view-gantt").classList.toggle("hidden", currentView !== "gantt");
  $("#view-board").classList.toggle("hidden", currentView !== "board");
  $("#view-minutes").classList.toggle("hidden", currentView !== "minutes");
  $("#view-summary").classList.toggle("hidden", currentView !== "summary");
  if (currentView === "table") renderTable();
  else if (currentView === "gantt") renderGantt();
  else if (currentView === "board") renderBoard();
  else if (currentView === "minutes") renderMinutes();
  else renderSummary();
  } catch(e) {
    const fullMsg = (e && e.stack) ? e.stack : String(e);
    try { localStorage.setItem("__board_err", fullMsg); } catch(_) {}
    console.error("⚠️ RENDER FAILED:", fullMsg);
    document.body.innerHTML = '<pre style="padding:30px;color:#800;background:#ffe;text-align:left;font-family:monospace;white-space:pre-wrap">⚠️ RENDER ERROR\\n' + fullMsg + '</pre>';
  }
}

/* ============================================================
   GANTT — date timeline with unavailable slots & today line
   ============================================================ */
/* ============================================================
   GANTT — date timeline with unavailable slots, today line, drag-edit
   ============================================================ */
const G = CONFIG.gantt;
const DAY_MS = 86400000;
function daysBetween(a, b) {
  return Math.round((new Date(b.getFullYear(), b.getMonth(), b.getDate()) -
                     new Date(a.getFullYear(), a.getMonth(), a.getDate())) / DAY_MS);
}
function dateToX(d) { return daysBetween(G.start, d) * G.dayWidth; }
function fmtDate(d) { return `${d.getMonth()+1}/${d.getDate()}`; }
function fullFmt(d) { return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; }

/** 解析 dates 字符串 → 段数组 [{start,end}, ...]。支持多段、顿号分隔、跨年 */
function parseDates(str) {
  if (!str) return [];
  const segments = String(str).split(/[、,，;；&]/).map(s => s.trim()).filter(Boolean);
  const baseYear = G.start.getFullYear();
  return segments.map(seg => {
    const parts = seg.split(/[~～\-]/).map(s => s.trim()).filter(Boolean);
    if (!parts.length) return null;
    // 先算起始日期，用起始日期的年份作为短格式结束日期的基准
    let startYear = baseYear;
    const mkDate = (s, refYear, refMonth) => {
      if (!/\//.test(s)) return null;
      const nums = s.split(/[\/\-]/).map(x => parseInt(x, 10)).filter(x => !isNaN(x));
      if (nums.length < 2) return null;
      let y, m, d;
      if (nums.length === 3) { y = nums[0]; m = nums[1]; d = nums[2]; }
      else { y = refYear; m = nums[0]; d = nums[1]; }  // 短格式：继承起始年
      // 跨年场景：起始是完整年份 + 月，结束是短格式（月更小）
      if (refMonth !== undefined && nums.length < 3 && m < refMonth) {
        y = refYear + 1;
      }
      try { return new Date(y, m - 1, d); } catch(e) { return null; }
    };
    if (parts.length === 1) {
      const dt = mkDate(parts[0], baseYear, undefined);
      if (dt) return { start: dt, end: dt };
      return null;
    }
    // 两段：先算 start，用它的 year 作为 end 的 refYear
    const start = mkDate(parts[0], baseYear, undefined);
    if (!start) return null;
    const refYear = start.getFullYear();
    const refMonth = start.getMonth();
    const end = mkDate(parts[1], refYear, refMonth);
    if (!end) return null;
    return { start, end };
  }).filter(Boolean);
}

function segmentsToDates(segs) {
  return segs.map(s => {
    const a = `${s.start.getFullYear()}/${s.start.getMonth()+1}/${s.start.getDate()}`;
    if (s.start.getTime() === s.end.getTime()) return a;
    const eb = `${s.end.getMonth()+1}/${s.end.getDate()}`;
    return `${a} ~ ${eb}`;
  }).join("、");
}

/** 判断段是否与某 unavailable 区间有重叠 */
function segHasConflict(seg) {
  return G.unavailable.some(([u1, u2]) => seg.end >= u1 && seg.start <= u2);
}

function renderGantt() {
  const data = filtered();
  if (!data.length) {
    $("#gantt-host").innerHTML = `<div class="empty" style="padding:40px;text-align:center">当前筛选下没有数据</div>`;
    $("#gantt-legend").innerHTML = ""; return;
  }

  // --- legend ---
  $("#gantt-legend").innerHTML = `
    <span><span class="swatch" style="background:linear-gradient(135deg,#4b63ff,#6a5af5)"></span>Workshop 任务条（可拖拽）</span>
    <span><span class="swatch" style="transform:rotate(45deg);display:inline-block;background:#7a5af5"></span>里程碑</span>
    <span><span class="swatch" style="background:repeating-linear-gradient(45deg,rgba(245,63,63,.1),rgba(245,63,63,.1) 5px,rgba(245,63,63,.04) 5px,rgba(245,63,63,.04) 10px)"></span>Bank User 不可用</span>
    <span><span class="swatch" style="background:#f53f3f"></span>今日</span>
    <span style="margin-left:auto;color:var(--text)">计划周期：${fmtDate(G.start)} ~ ${fmtDate(G.end)}（${daysBetween(G.start, G.end)+1} 天）</span>
  `;

  const totalDays = daysBetween(G.start, G.end) + 1;
  const chartW = totalDays * G.dayWidth;
  const labelW = G.labelW;
  const colTemplate = `${labelW}px repeat(${totalDays}, ${G.dayWidth}px)`;

  // --- 时间轴 header：第一列是 label 占位、后续是月份+日期 ---
  let monthLabels = "";
  let cur = new Date(G.start);
  while (cur <= G.end) {
    const firstOfMonth = new Date(cur.getFullYear(), cur.getMonth(), 1);
    const lastOfMonth  = new Date(cur.getFullYear(), cur.getMonth() + 1, 0);
    const mStart = firstOfMonth < G.start ? G.start : firstOfMonth;
    const mEnd   = lastOfMonth > G.end ? G.end : lastOfMonth;
    const days   = daysBetween(mStart, mEnd) + 1;
    monthLabels += `<div class="gantt-month" style="grid-column:span ${days}">${cur.getFullYear()}/${cur.getMonth()+1}月</div>`;
    cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
  }
  let dayCells = "";
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(G.start.getFullYear(), G.start.getMonth(), G.start.getDate() + i);
    const isWknd = d.getDay() === 0 || d.getDay() === 6;
    dayCells += `<div class="gantt-day ${isWknd ? "weekend" : ""}">${d.getDate()}</div>`;
  }

  // --- unavailable 遮罩（只画一份在 body 最底层） ---
  let unavailHTML = "";
  G.unavailable.forEach(([s, e]) => {
    const x1 = dateToX(s);
    const x2 = dateToX(e) + G.dayWidth;
    if (x2 < 0 || x1 > chartW) return;
    const x = Math.max(0, x1), ww = Math.min(chartW, x2) - x;
    unavailHTML += `<div class="gantt-unavail" style="left:${x}px;width:${ww}px" title="Bank User 不可用：${fmtDate(s)} ~ ${fmtDate(e)}"></div>`;
  });

  // --- today 线 ---
  const today = new Date(); today.setHours(0,0,0,0);
  let todayHTML = "";
  if (today >= G.start && today <= G.end) {
    const tx = dateToX(today) + G.dayWidth / 2;
    const dows = ["日","一","二","三","四","五","六"];
    todayHTML = `<div class="gantt-today" style="left:${tx}px"></div>
                 <div class="gantt-today-label" style="left:${tx}px">今日 ${fmtDate(today)} 周${dows[today.getDay()]}</div>`;
  }

  // --- 按批次分组 ---
  const order = CONFIG.priorities.map(p => p.key);
  const byPrio = {};
  data.forEach(i => { const b = i.priority || "未分批"; (byPrio[b] = byPrio[b] || []).push(i); });
  const batches = Object.keys(byPrio).sort((a, b) => order.indexOf(a) - order.indexOf(b));

  // --- 任务条颜色映射（用深色，白字） ---
  const barPalette = {
    "第1轮":  "#3349cc",
    "第2轮":  "#078fb0",
    "第3轮":  "#d95a15",
    "全项目": "#d93f3f",
  };
  const barColorFor = prio => barPalette[prio] || "#7a5af5";

  // --- 里程碑类型判断 ---
  const kindOf = name => {
    if (!name) return "workshop";
    if (/Sign\s*Off/i.test(name) || /Confirmation/i.test(name)) return "gate";
    if (/GAP\s*Solution|Refine\s*Document/i.test(name)) return "milestone-task";
    return "workshop";
  };
  const editorName = CONFIG.editorName || "PMO";

  // --- 构建甘特图 body（按批次分组） ---
  let bodyHTML = "";
  let gateOverlaysHTML = "";
  batches.forEach(batch => {
    const p = prioOf(batch);

    // 先收集该批次的 Gate 里程碑（结束日菱形 + 垂直虚线）
    const gates = [];
    byPrio[batch].forEach(item => {
      if (kindOf(item.name) !== "gate") return;
      parseDates(item.dates).forEach(seg => {
        gates.push({
          gateX: dateToX(seg.end) + G.dayWidth / 2,
          endDay: seg.end,
          label: (item.name || "").replace(/【里程碑】/g, ""),
          item,
        });
      });
    });

    bodyHTML += `<div class="grid-row heading-row" style="grid-template-columns:${colTemplate}">
      <div class="label-cell"><span class="badge" style="background:${p.color};color:${p.text}">${esc(batch)}</span></div>
      <div class="timeline-cell" style="grid-column:2 / -1"></div>
    </div>`;

    // 每个 item 的任务条
    byPrio[batch].forEach((item, idx) => {
      const kind = kindOf(item.name);
      const segs = parseDates(item.dates);
      const baseColor = barColorFor(item.priority);
      const isDone = ["confirmed", "signoff"].includes(item.status);

      let segBars = "";
      segs.forEach((seg, segIdx) => {
        const x = dateToX(seg.start);
        const spanDays = daysBetween(seg.start, seg.end) + 1;
        const w = Math.max(spanDays * G.dayWidth - 2, 32);
        const label = `${seg.start.getMonth()+1}/${seg.start.getDate()}${seg.start.getTime()!==seg.end.getTime()?`-${seg.end.getMonth()+1}/${seg.end.getDate()}`:""}`;
        const tip = `${esc(item.name)} · ${esc(item.dates || "")}`;

        if (kind === "gate") {
          // Gate 里程碑：item 行里画一个淡色范围参考条（大菱形已在 batch-group 层面）
          segBars += `<div class="gantt-bar bar-done" style="left:${x}px;width:${w}px;background:rgba(217,63,63,.18);border:1px dashed rgba(217,63,63,.5);color:#d93f3f;cursor:pointer" data-id="${item.id}" data-seg="${segIdx}" title="${tip}">
            <span style="font-weight:500;font-size:10.5px">🔴 Gate · ${esc(item.name.replace(/【里程碑】/g, ""))}</span>
          </div>`;
        } else if (kind === "milestone-task") {
          segBars += `<div class="gantt-bar is-milestone" style="left:${x}px;width:${w}px;background:${baseColor};color:#fff" data-id="${item.id}" data-seg="${segIdx}" title="${tip}">
            <span class="resize left"></span><span>${esc(label)}</span><span class="resize right"></span>
          </div>`;
        } else {
          segBars += `<div class="gantt-bar" style="left:${x}px;width:${w}px;background:${baseColor};color:#fff" data-id="${item.id}" data-seg="${segIdx}" title="${tip}">
            <span class="resize left"></span><span>${esc(label)}</span><span class="resize right"></span>
          </div>`;
        }
      });

      // changelog 显示（独立一行，完整显示最近一次修改）
      const cl = (item.changelog || [])[0];
      const clLine = cl ? `<div class="gantt-row-cl">📝 ${esc(cl.time)} · ${esc(cl.user)}：${esc(cl.action)}</div>` : "";
      const typeTag = kind === "gate" ? "· 🔴 Gate" : kind === "milestone-task" ? "· 📋 里程碑" : "";

      bodyHTML += `<div class="grid-row" style="grid-template-columns:${colTemplate}">
        <div class="label-cell">
          <div class="gantt-row-name" data-gid="${item.id}">${esc(item.name.replace(/【里程碑】/g, ""))}</div>
          <div class="gantt-row-meta">
            ${esc(item.dates || "")} · ${esc(statusOf(item.status).label)}${typeTag}${item.owner ? " · " + esc(item.owner) : ""}
          </div>
          ${clLine}
        </div>
        <div class="timeline-cell bars-host" data-idx="${idx}" data-batch="${batch}" style="grid-column:2 / -1">${segBars}</div>
      </div>`;
    });

    // 该批次 Gate 覆盖层（虚线 + 菱形）— 拼到 gateOverlaysHTML，最终写到整份 body overlay 里
    if (gates.length) {
      gates.forEach(g => {
        const tip = `${esc(g.label)} — Gate 截止：${fullFmt(g.endDay)}`;
        gateOverlaysHTML += `<div class="gate-line" style="left:${g.gateX}px"></div>
          <div class="gate-diamond" style="left:${g.gateX - 10}px;top:0" title="${tip}" data-gate="${g.item.id}"></div>
          <div class="gate-label" style="left:${g.gateX}px">◆ ${esc(g.label.replace(/【里程碑】/g, "").slice(0,18))} · ${fmtDate(g.endDay)}</div>`;
      });
    }

  });

  // ========== 写入 DOM ==========
  const host = document.getElementById("gantt-host");
  host.innerHTML = `
    <div class="gantt-wrap" style="min-width:${labelW + chartW}px">
      <div class="gantt-head gantt-grid" style="grid-template-columns:${colTemplate}">
        <div class="label-cell"></div>
        ${monthLabels}
        ${dayCells}
      </div>
      <div class="gantt-body gantt-grid" style="grid-template-columns:${colTemplate};position:relative">
        <div class="gantt-shared-overlay" style="left:${labelW}px;width:${chartW}px">${unavailHTML}${todayHTML}${gateOverlaysHTML}</div>
        ${bodyHTML}
      </div>
    </div>
  `;

  // ========== 交互层 ==========
  document.querySelectorAll(".gantt-tooltip").forEach(el => el.remove());
  const tooltip = document.createElement("div");
  tooltip.className = "gantt-tooltip"; tooltip.style.display = "none";
  document.body.appendChild(tooltip);

  const showTip = (e, item) => {
    const p = prioOf(item.priority), st = statusOf(item.status);
    const segs = parseDates(item.dates);
    const ranges = segs.map(s => `${fullFmt(s.start)}${s.start.getTime() !== s.end.getTime() ? ` ~ ${fmtDate(s.end)}` : ""}`).join("<br>");
    const typeTag = kindOf(item.name) === "gate" ? "🔴 Gate 里程碑（必须完成的检查点）" : kindOf(item.name) === "milestone-task" ? "📋 里程碑工作流" : "💼 Workshop 任务";
    const tips = linesOf(item.remarks).slice(0, 3);
    const cl = (item.changelog || []).slice(0, 2).map(c => `📝 ${esc(c.time)} · ${esc(c.user)}<br>   ${esc(c.action)}`).join("<br>");
    tooltip.innerHTML = `<strong>${esc(item.name)}</strong>
      <div style="color:#ffb4b4">${typeTag}</div>
      ${item.dates ? `<div>${ranges}</div>` : ""}
      <div>${esc(p.key)} · ${esc(st.label)}</div>
      ${item.owner ? `<div>BA：${esc(item.owner)}</div>` : ""}
      ${cl ? `<div style="margin-top:6px;padding-top:4px;border-top:1px solid rgba(255,255,255,.2);color:#bfe4ff;font-size:11.5px">${cl}</div>` : ""}
      ${tips.length ? `<div style="margin-top:4px;color:#ffb4b4">${tips.map(t=>esc(t)).join("<br>")}</div>` : ""}`;
    tooltip.style.display = "block";
    const r = e.target.closest(".gantt-bar, .gantt-row-name, .gate-diamond").getBoundingClientRect();
    tooltip.style.left = Math.min(e.clientX + 16, window.innerWidth - 360) + "px";
    tooltip.style.top  = Math.min(r.bottom + 6, window.innerHeight - 130) + "px";
  };
  const hideTip = () => tooltip.style.display = "none";

  // 点击 / hover 事件
  document.querySelectorAll(".gantt-bar").forEach(b => {
    b.onclick = e => { e.stopPropagation(); openDetail(items.find(i => i.id == b.dataset.id)); };
    b.onmouseenter = e => showTip(e, items.find(i => i.id == b.dataset.id));
    b.onmouseleave = hideTip;
  });
  document.querySelectorAll(".gantt-row-name").forEach(el => {
    el.onclick = () => openDetail(items.find(i => i.id == el.dataset.gid));
    el.onmouseenter = e => showTip(e, items.find(i => i.id == el.dataset.gid));
    el.onmouseleave = hideTip;
  });
  document.querySelectorAll(".gate-diamond").forEach(d => {
    d.onclick = () => openDetail(items.find(i => i.id == d.dataset.gate));
    d.onmouseenter = e => showTip(e, items.find(i => i.id == d.dataset.gate));
    d.onmouseleave = hideTip;
  });

  // ========== 拖拽 + 审计记录 ==========
  let drag = null;
  let hintEl = null;
  let prevDatesStr = null;

  const showHint = txt => {
    if (!hintEl) { hintEl = document.createElement("div"); hintEl.className = "gantt-drag-hint"; document.body.appendChild(hintEl); }
    hintEl.textContent = txt; hintEl.style.display = "block";
  };
  const hideHint = () => { if (hintEl) hintEl.style.display = "none"; };

  document.querySelectorAll(".gantt-bar").forEach(bar => {
    bar.addEventListener("mousedown", e => {
      const id = Number(bar.dataset.id);
      const item = items.find(i => i.id === id);
      const segs = parseDates(item.dates);
      const segIdx = Number(bar.dataset.seg);
      const seg = segs[segIdx];
      if (!seg) return;
      e.preventDefault();
      prevDatesStr = item.dates;

      const target = e.target.closest(".resize");
      let mode = "move";
      if (target) mode = target.classList.contains("left") ? "resize-left" : "resize-right";

      drag = { bar, item, seg, segs, segIdx, mode,
        startX: e.clientX,
        origStart: new Date(seg.start.getTime()),
        origEnd: new Date(seg.end.getTime()),
        dayWidth: G.dayWidth,
      };
      bar.classList.add("dragging");
      hideTip();

      document.addEventListener("mousemove", onDrag);
      document.addEventListener("mouseup", endDrag);
    });
  });

  function onDrag(e) {
    if (!drag) return;
    const dx = e.clientX - drag.startX;
    const ddays = Math.round(dx / drag.dayWidth);

    let ns = new Date(drag.origStart.getTime());
    let ne = new Date(drag.origEnd.getTime());

    if (drag.mode === "move") { ns.setDate(ns.getDate() + ddays); ne.setDate(ne.getDate() + ddays); }
    else if (drag.mode === "resize-left") { ns.setDate(ns.getDate() + ddays); if (daysBetween(ns, ne) < 1) ns = new Date(ne.getTime()); }
    else if (drag.mode === "resize-right") { ne.setDate(ne.getDate() + ddays); if (daysBetween(ns, ne) < 1) ne = new Date(ns.getTime()); }

    if (ns < G.start) ns = new Date(G.start.getTime());
    if (ne > G.end)   ne = new Date(G.end.getTime());

    drag.seg.start = ns; drag.seg.end = ne;
    drag.bar.style.left = dateToX(ns) + "px";
    drag.bar.style.width = Math.max(daysBetween(ns, ne) + 1, 1) * drag.dayWidth - 2 + "px";

    const inner = drag.bar.querySelector("span:nth-child(2)");
    if (inner) inner.textContent = `${ns.getMonth()+1}/${ns.getDate()}${ns.getTime()!==ne.getTime()?`-${ne.getMonth()+1}/${ne.getDate()}`:""}`;

    const labelCell = drag.bar.closest(".grid-row").querySelector(".label-cell");
    const meta = labelCell ? labelCell.querySelector(".gantt-row-meta") : null;
    if (meta) {
      const newDatesTxt = segmentsToDates(drag.segs);
      const stLabel = statusOf(drag.item.status).label;
      meta.textContent = `${newDatesTxt} · ${stLabel}${drag.item.owner ? " · " + drag.item.owner : ""}`;
    }

    showHint(`拖拽中：${segmentsToDates([{start:ns,end:ne}])}`);
  }

  function endDrag() {
    if (!drag) return;
    document.removeEventListener("mousemove", onDrag);
    document.removeEventListener("mouseup", endDrag);
    drag.bar.classList.remove("dragging");

    const newDatesStr = segmentsToDates(drag.segs);
    if (prevDatesStr && prevDatesStr !== newDatesStr) {
      if (!drag.item.changelog) drag.item.changelog = [];
      drag.item.changelog.unshift({
        user: editorName,
        time: new Date().toLocaleString("zh-CN", { hour12: false }),
        action: `计划 ${prevDatesStr} → ${newDatesStr}`,
        from: prevDatesStr,
        to: newDatesStr,
        mode: drag.mode,
      });
      store.save(items);
      const itemName = drag.item.name.replace(/【里程碑】/g, "");
      hideHint();
      showToast(`✅ 已更新 ${itemName} 计划：${prevDatesStr} → ${newDatesStr}（审计已记录）`);
    } else {
      hideHint();
      showToast("时间未变化，未记录");
    }

    drag = null;
    prevDatesStr = null;
  }

}  // ← renderGantt 结束

function _doExportCSV(data) {
  if (!data.length) { showToast("无可导出条目"); return; }
  const rows = [["模块", "批次", "阶段", "计划起止", "实际起止", "类别", "内容", "负责BA", "备注", "日期变更记录"]];

    const clStr = (it.changelog || []).map(c => `${c.time} ${c.user}：${c.action}`).join("；");
    let first = true;
    const allSecs = SECTIONS.concat([{ key: "remarks", label: "备注/风险" }]);
    allSecs.forEach(s => linesOf(it[s.key]).forEach(l => {
      rows.push([
        first ? it.name : "", first ? (it.priority || "") : "", first ? statusOf(it.status).label : "",
        first ? (it.dates || "") : "", first ? (it.actual || "") : "",
        s.label, l,
        first ? (it.owner || "") : "",
        first ? baseCl : "",
        first ? clStr : "",
      ]);
      first = false;
    }));
    if (first && (baseCl || clStr)) {
      rows.push([it.name, it.priority || "", statusOf(it.status).label, it.dates || "", it.actual || "",
                 "基本信息", "", it.owner || "", baseCl, clStr]);
    }
  });
  const csv = "\uFEFF" + rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `K Bank Workshop讨论点汇总_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  showToast(`已导出 CSV（${rows.length - 1} 条记录）`);
}

/* ---- incremental minutes merge (只增不删：合并 CONFIG.updates 到本地数据，不覆盖已有内容) ---- */
function applyUpdates(list) {
  const key = CONFIG.storageKey + ":mergedVer";
  if (String(CONFIG.dataVersion) === localStorage.getItem(key)) return null;
  let added = 0;
  (CONFIG.updates || []).forEach(u => {
    let it = (typeof u.id === "number") ? list.find(i => i.id === u.id) : null;
    if (!it && u.module) it = list.find(i => (i.name || "") === u.module);
    if (!it) {
      if (!u.module) return;
      it = { id: u.id || (Date.now() + Math.floor(Math.random() * 1000)), name: u.module,
             status: u.status || "plan", priority: u.priority || "第1轮",
             dates: u.dates || "", actual: "", owner: u.owner || "" };
      list.unshift(it);
    } else if (u.status) {
      it.status = u.status;
    }
    Object.keys(u.add || {}).forEach(field => {
      // minutes 是对象数组，特殊处理（按 time+user+title 去重）
      if (field === "minutes") {
        if (!Array.isArray(it.minutes)) it.minutes = [];
        (u.add.minutes || []).forEach(m => {
          const key = (m.time||"") + "|" + (m.user||"") + "|" + (m.title||"");
          const exists = it.minutes.find(x => ((x.time||"")+"|"+(x.user||"")+"|"+(x.title||"")) === key);
          if (!exists) { it.minutes.push(m); added++; }
        });
        return;
      }
      const cur = linesOf(it[field]);
      (u.add[field] || []).forEach(line => {
        const s = String(line ?? "").trim();
        if (s && !cur.includes(s)) { cur.push(s); added++; }
      });
      it[field] = cur;
    });
  });
  localStorage.setItem(key, String(CONFIG.dataVersion));
  return added;
}

  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add("show"));

}

  const dActual = parseDateRange(d.actual || "");
  const dateFieldHTML = (label, startVal, endVal) => `
    <div class="field"><label>${label}</label>
      <div style="display:flex;gap:6px;align-items:center;">
        <input type="date" value="${startVal}" style="flex:1;padding:6px 8px;border:1px solid var(--border-strong);border-radius:8px;font-size:12.5px;font-family:inherit;">
        <span style="color:var(--text-soft);font-size:12px;">~</span>
        <input type="date" value="${endVal}" style="flex:1;padding:6px 8px;border:1px solid var(--border-strong);border-radius:8px;font-size:12.5px;font-family:inherit;">
      </div>
      <div style="font-size:11px;color:var(--text-soft);margin-top:3px;">留空则表示不确定；只填开始=单日</div>
    </div>`;
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="modal">
    <h2>${editing ? "编辑条目" : "新建条目"}</h2>
    <div class="sub">${editing ? "每条意见独立成一格，可自由换行；修改后点击保存生效" : "填写模块/里程碑信息创建一条新条目"}</div>
    <div class="field-row">
      <div class="field"><label>批次</label><select id="m-priority">${opts(CONFIG.priorities, d.priority)}</select></div>
      <div class="field"><label>阶段</label><select id="m-status">${opts(CONFIG.statuses, d.status)}</select></div>
    </div>
    <div class="field"><label>模块 / 里程碑</label><input id="m-name" value="${esc(d.name)}" placeholder="如：Deposit (TD/DD) 存款" /></div>
    <div class="field-row">
      <div class="field" style="flex:1;">
        <label>计划起止</label>
        <div style="display:flex;gap:6px;align-items:center;">
          <input id="m-dates-start" type="date" value="${dDates.start}" style="flex:1;padding:6px 8px;border:1px solid var(--border-strong);border-radius:8px;font-size:12.5px;">
          <span style="color:var(--text-soft);">~</span>
          <input id="m-dates-end" type="date" value="${dDates.end}" style="flex:1;padding:6px 8px;border:1px solid var(--border-strong);border-radius:8px;font-size:12.5px;">
        </div>
      </div>
      <div class="field" style="flex:1;">
        <label>实际起止</label>
        <div style="display:flex;gap:6px;align-items:center;">
          <input id="m-actual-start" type="date" value="${dActual.start}" style="flex:1;padding:6px 8px;border:1px solid var(--border-strong);border-radius:8px;font-size:12.5px;">
          <span style="color:var(--text-soft);">~</span>
          <input id="m-actual-end" type="date" value="${dActual.end}" style="flex:1;padding:6px 8px;border:1px solid var(--border-strong);border-radius:8px;font-size:12.5px;">
        </div>
      </div>
    </div>
    <div class="field"><label>负责BA</label><input id="m-owner" value="${esc(d.owner || "")}" placeholder="如：BA-李四" /></div>
    ${CONFIG.fields.filter(f => f.type === "items").map(f => itemListHTML(f, d)).join("")}
    <div class="modal-actions">
      ${editing ? '<button class="link-danger" id="m-del">删除</button>' : ""}
      <div class="spacer"></div>
      <button class="btn ghost" id="m-cancel">取消</button>
      <button class="btn" id="m-save">保存</button>
    </div></div>`;
  document.body.appendChild(overlay);
  overlay.querySelectorAll(".item-list").forEach(list => {
    list.querySelectorAll(".item-row").forEach(row => wireRow(row, list));
    list.querySelector(".add-item").onclick = e => { e.preventDefault(); addRow(list); };
    renumber(list);
  });
  const close = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelector("#m-cancel").onclick = close;
  overlay.querySelector("#m-save").onclick = () => {
    d.name = overlay.querySelector("#m-name").value.trim() || "未命名";
    d.priority = overlay.querySelector("#m-priority").value;
    d.status = overlay.querySelector("#m-status").value;
    d.owner = overlay.querySelector("#m-owner").value.trim();
    // 日期：两个 date input 拼成格式化字符串
    d.dates = formatDateRange(overlay.querySelector("#m-dates-start").value, overlay.querySelector("#m-dates-end").value);
    d.actual = formatDateRange(overlay.querySelector("#m-actual-start").value, overlay.querySelector("#m-actual-end").value);
    overlay.querySelectorAll(".item-list").forEach(list => {
      d[list.dataset.field] = Array.from(list.querySelectorAll("textarea"))
        .map(t => t.value.replace(/\r/g, "").replace(/^\n+|\n+$/g, "").trim())
        .filter(Boolean);
    });
    if (!editing) items.unshift(d);
    persist(); close();
  };
  if (editing) overlay.querySelector("#m-del").onclick = () => { close(); confirmDelete(d); };
}

/* ---- 只读详情抽屉（长文本按条完整展示） ---- */
function openDetail(item) {
  if (!item) return;
  const block = (label, cls, arr) => {
    if (!arr.length) return "";
    return `<div class="d-sec"><div class="d-title ${cls}">${label}（${arr.length}）</div><ol>${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>`;
  };
  const secs = SECTIONS.map(s => block(s.label, s.cls, linesOf(item[s.key]))).join("") +
               block("备注/风险", "", linesOf(item.remarks));
  // changelog section
  const cl = (item.changelog || []);
  const clSec = cl.length ? `<div class="d-sec"><div class="d-title" style="color:#8a5af5">📝 日期变更记录（${cl.length}）</div>
    <ol>${cl.map(c => `<li><div style="font-size:12px;color:#8a92a3;margin-bottom:2px">${esc(c.time)} · ${esc(c.user)} · ${esc(c.mode || "")}</div><div>${esc(c.action)}</div></li>`).join("")}</ol></div>` : "";
  // minutes section（原版纪要归档）
  const mins = (item.minutes || []).sort((a,b) => (b.time||"").localeCompare(a.time||""));
  const minsSec = mins.length ? `<div class="d-sec"><div class="d-title" style="color:#1d8db5">📁 原版会议纪要（${mins.length} 份）</div>
    ${mins.map(m => `<details style="margin-bottom:6px;background:#fafbfd;border:1px solid var(--border);border-radius:6px;padding:6px 10px">
      <summary style="cursor:pointer;font-weight:600;font-size:12.5px">${esc(m.title || "未命名纪要")} <span style="color:var(--text-soft);font-weight:400;margin-left:8px">${esc(m.time||"")} · ${esc(m.user||"")}</span></summary>
      <div style="margin-top:8px;font-size:12px;line-height:1.6;color:#333;white-space:pre-wrap;background:#fff;border:1px solid var(--border);border-radius:4px;padding:8px">${esc(m.content || "")}</div>
    </details>`).join("")}
  </div>` : "";
  const p = prioOf(item.priority), st = statusOf(item.status);
  const overlay = document.createElement("div");
  overlay.className = "drawer-overlay";
  overlay.innerHTML = `<aside class="drawer">
    <header>
      <div class="d-badges">
        <span class="badge" style="background:${p.color};color:${p.text}">${esc(p.key)}</span>
        <span class="badge" style="background:${st.color};color:${st.text}">${esc(st.label)}</span>
      </div>
      <h2>${esc(item.name)}</h2>
      <div class="d-meta">
        ${item.dates ? `<span>计划 ${esc(item.dates)}</span>` : ""}
        ${item.actual ? `<span>实际 ${esc(item.actual)}</span>` : ""}
        ${item.owner ? `<span>负责BA ${esc(item.owner)}</span>` : ""}
      </div>
    </header>
    <div class="d-body">${secs || `<p class="sum-empty">暂无会议记录点</p>`}${clSec}${minsSec}</div>
    <footer>
      <button class="btn ghost" id="d-close">关闭</button>
      <div class="spacer"></div>
      <button class="btn" id="d-edit">编辑此条目</button>
    </footer>
  </aside>`;
  document.body.appendChild(overlay);
  const close = () => { overlay.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelector("#d-close").onclick = close;
  overlay.querySelector("#d-edit").onclick = () => { close(); openModal(item); };
}

/* ---- delete confirmation ---- */
function confirmDelete(item) {
  if (!item) return;
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="modal" style="width:380px">
    <h2>删除条目</h2>
    <div class="sub">确定删除「${esc(item.name)}」？此操作不可撤销。</div>
    <div class="modal-actions">
      <div class="spacer"></div>
      <button class="btn ghost" id="c-cancel">取消</button>
      <button class="btn danger" id="c-ok">删除</button>
    </div></div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelector("#c-cancel").onclick = close;
  overlay.querySelector("#c-ok").onclick = () => { items = items.filter(i => i.id !== item.id); persist(); close(); };
}

/* ---- wire controls ---- */
function initFilters() {
  const fs = $("#filter-status"); fs.innerHTML = '<option value="">全部阶段</option>' + CONFIG.statuses.map(s => `<option value="${esc(s.key)}">${esc(s.label || s.key)}</option>`).join("");
  const fp = $("#filter-priority"); fp.innerHTML = '<option value="">全部批次</option>' + CONFIG.priorities.map(p => `<option value="${esc(p.key)}">${esc(p.key)}</option>`).join("");
}
document.querySelectorAll(".tab").forEach(tab =>
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentView = tab.dataset.view;
    render();
  });
["#filter-status", "#filter-priority", "#search"].forEach(sel => $(sel).oninput = render);

// 🔗 Firebase 模式下不再区分本地/公网——所有人读写同一个云端，编辑自动同步
$("#btn-new").onclick = () => openModal(null);
$("#btn-export-html").onclick = exportSummaryHTML;
$("#btn-export-csv").onclick = exportSummaryCSV;
$("#btn-export-minutes").onclick = exportAllMinutes;
$("#btn-settings").onclick = openSettings;

// 🔄 手动同步（保留：Firebase 配置为空时 fallback 到 fetch data.json）
async function manualSync() {
  try {
    const resp = await fetch("data.json", { cache: "no-cache" });
    if (!resp.ok) { showToast("❌ 拉取失败（本地模式没有 data.json）"); return; }
    const remote = await resp.json();
    const remoteItems = Array.isArray(remote) ? remote : (remote.items || []);
    if (!remoteItems.length) { showToast("⚠️  远端没有数据"); return; }
    const remoteMap = new Map(remoteItems.map(x => [x.id, x]));
    const localIds = new Set(items.map(x => x.id));
    // 合并
    items = items.map(it => {
      const r = remoteMap.get(it.id); if (!r) return it;
      const merged = { ...it, ...r };
      const rc = r.changelog || [], lc = it.changelog || [];
      const rcKeys = new Set(rc.map(c => c.time + "|" + c.from + "|" + c.to));
      merged.changelog = [...rc, ...lc.filter(c => !rcKeys.has(c.time + "|" + c.from + "|" + c.to))];
      const rm = r.minutes || [], lm = it.minutes || [];
      const rmKeys = new Set(rm.map(m => (m.time||"") + "|" + (m.title||"")));
      merged.minutes = [...rm, ...lm.filter(m => !rmKeys.has((m.time||"") + "|" + (m.title||"")))];
      ["confirmed","disputes","discussions","gapConclusion","nextStep","deliverables","remarks"].forEach(f => {
        merged[f] = [...new Set([...linesOf(r[f]), ...linesOf(it[f])])];
      });
      return merged;
    });
    items = [...items, ...remoteItems.filter(x => !localIds.has(x.id))];
    // dicts 合并
    if (remote.dicts) {
      if (Array.isArray(remote.dicts.priorities)) CONFIG.priorities = remote.dicts.priorities;
      if (Array.isArray(remote.dicts.statuses)) CONFIG.statuses = remote.dicts.statuses;
    }
    persist(); initFilters(); render();
    showToast(`✅ 已同步（${remoteItems.length} 条模块）`);
  } catch (e) { showToast("❌ 同步失败：" + e.message); }
}

// 📤 导出时也带 dicts（让 dicts 能随数据传输）
const _origExport = exportBoardJSON;
exportBoardJSON = function() {
  // 导出完整包：{ items: [...], dicts: {...} }
  const payload = { items, dicts: { priorities: CONFIG.priorities, statuses: CONFIG.statuses } };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `K Bank看板完整数据_${new Date().toISOString().slice(0,10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  showToast("✅ 已导出完整数据（含字典 + changelog + 纪要）");
};
